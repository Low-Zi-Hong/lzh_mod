name: build
on:
  push:
    branches:
      - main
      - mc26
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # 【核心修复 1】：赋予 Release 写入权限
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x gradlew

      - name: build with gradle
        # 使用 build 确保生成所有 jar
        run: ./gradlew build

      # 【核心修复 2】：更稳妥地抓取 jar 包名字
      - name: get version
        id: get_version
        run: |
          # 寻找 build/libs 下不带 -sources 和 -dev 的那个主 jar 包
          JAR_NAME=$(ls build/libs/ | grep ".jar" | grep -v "-sources" | grep -v "-dev" | head -n 1)
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "找到的 JAR 包是: $JAR_NAME"

      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 使用精确的文件路径
          files: build/libs/${{ steps.get_version.outputs.JAR_NAME }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}